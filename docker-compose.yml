services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    volumes:
      - ./src/db/init/init.sql/:/docker-entrypoint-initdb.d/00-init.sql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - TZ=UTC
      - PGTC=UTC
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio-dev
      MINIO_ROOT_PASSWORD: minio-dev
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minio-dev minio-dev;
      /usr/bin/mc mb myminio/test;
      /usr/bin/mc policy set public myminio/test;
      exit 0;
      "
